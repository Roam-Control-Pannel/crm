# LINT-V1 / CI-V1
#
# Until now this repository had no CI at all: the only workflows were the two
# cron backups. Nothing ran `tsc`, nothing ran a build, and `npm run lint`
# could not run because there was no ESLint config — so the whole class of
# hook-dependency and unused-binding problems had to be found by reading the
# code, once a week, by hand.
#
# This runs the same three checks a contributor runs locally, on every PR and
# every push to main. Kept deliberately cheap so it stays fast enough that
# nobody is tempted to skip it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in netlify.toml — CI should fail for the same
          # reasons production would, not for version drift.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --max-warnings is a ratchet, not a target. Errors always fail.
      #
      # `next lint` was removed in Next 16, so this calls the eslint CLI
      # directly against eslint.config.mjs. The allowance went from 5 to 57
      # in that upgrade and the jump is almost entirely one thing:
      # eslint-config-next 16 enables React Compiler's correctness rules,
      # which report 50 findings this codebase has never been checked
      # against. They are real — react-hooks/static-components is the
      # "component declared inside render" already on the known-issues list
      # — and they are warnings rather than errors only so that a framework
      # upgrade did not also become a fifty-site refactor.
      #
      # 5 of the 57 are the original unused-variable warnings. Lower this
      # number as the rest are cleared; do not raise it.
      - name: Lint
        run: npx eslint . --max-warnings 57

      - name: Build
        run: npm run build
