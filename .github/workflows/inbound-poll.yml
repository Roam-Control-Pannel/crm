# Redundant trigger for the inbound IMAP reply poller.
#
# Why this exists: inbound-poll was the only one of the three scheduled jobs
# with no backup trigger. Its two siblings each got one after Netlify's
# scheduled-function cron silently failed to register on this site — the same
# scheduler this job still depends on alone.
#
# The failure is quiet and its consequences are not. When the poller stops,
# replies are never ingested, so OUTREACH_STATUS is never flipped to
# `responded`. The 08:00 sequences run then still sees those contacts as
# `email_sent` and, finalNudgeDays later, sends a "final nudge" to a prospect
# who already wrote back.
#
# Double-triggering is safe: the poll is idempotent. Messages already carrying
# the `crm-processed` Gmail label are excluded by the IMAP search itself, and
# storeReply() is keyed on (email, uid).
#
# Setup (one-time):
#   1. Add a repository secret named CRON_SECRET_V2 with the same value used
#      in the Netlify environment:
#        Settings → Secrets and variables → Actions → New repository secret
#   2. (Optional) Override the target site by adding a repository variable
#      SITE_URL; otherwise the production URL below is used.
#   3. Scheduled workflows only run from the repository's DEFAULT branch, so
#      this file must be merged to main before the schedule takes effect.

name: inbound-poll

on:
  schedule:
    # Every 15 minutes, matching the Netlify schedule in netlify.toml. May be
    # delayed under GitHub load; this is a safety net, not the primary path.
    - cron: '*/15 * * * *'
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

# Don't let slow/delayed runs pile up — concurrent IMAP sessions against the
# same mailbox count towards Gmail's ~15-connection ceiling.
concurrency:
  group: inbound-poll
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/inbound/poll
        env:
          CRON_SECRET_V2: ${{ secrets.CRON_SECRET_V2 }}
          SITE_URL: ${{ vars.SITE_URL || 'https://roam-crm-platform.netlify.app' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET_V2:-}" ]; then
            echo "::error::CRON_SECRET_V2 repository secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # --max-time / --connect-timeout: the poller talks to Gmail, which
          # stalls rather than refusing when it throttles. Without a ceiling
          # the job only dies at the 5-minute timeout, logging nothing useful.
          response="$(curl -sS -X GET \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET_V2}" \
            -w $'\n%{http_code}' \
            "${SITE_URL}/api/inbound/poll")"

          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          echo "HTTP ${status}"
          echo "${body}"

          # CRON-REPORTING-V1: 207 means the request succeeded but some
          # replies failed to process — accept it at the transport level, then
          # fail on the content below so it is not silently green.
          if [ "${status}" != "200" ] && [ "${status}" != "207" ]; then
            echo "::error::inbound-poll returned HTTP ${status}"
            exit 1
          fi

          if ! printf '%s' "$body" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "::error::inbound-poll reported ok=false: $(printf '%s' "$body" | jq -r '.error // "no detail"')"
            exit 1
          fi

          errors="$(printf '%s' "$body" | jq -r '.errors // 0')"
          if [ "${errors}" != "0" ] && [ "${errors}" != "null" ]; then
            echo "::error::inbound-poll: ${errors} repl(y/ies) failed to process. Those messages were NOT labelled processed and will be retried next run, but a persistent count here means replies are not reaching the CRM."
            exit 1
          fi
