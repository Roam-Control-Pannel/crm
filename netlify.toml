[build]
  command = "next build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Run the whole CRM on UK time. "Europe/London" tracks GMT in winter and BST
  # in summer automatically, so server-side Date logic (SSR, posting-slot
  # interpretation in lib/social-cron.ts) matches the UK-based team's clock.
  TZ = "Europe/London"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled functions in netlify/functions/*.mts each ALSO declare an inline
# `export const config = { schedule: '...' }`. The duplication is intentional:
# the inline declaration is the source of truth for developers reading the
# function file, and the netlify.toml entries below force Netlify's scheduler
# to actually register the cron. On a Next.js site mediated by
# @netlify/plugin-nextjs the inline-only style sometimes shows "Scheduled" in
# the UI without firing — declaring here as well closes that gap.

# CRON-PUBLISH-V1
# Every 2 minutes, fire any social post whose scheduledAt has arrived.
# NOTE: this was previously "* * * * *" (every minute). That sits at Netlify's
# practical minimum and the scheduler silently declined to register/fire it —
# the function showed as "Scheduled" but never ran, so scheduled posts stayed
# stuck at status 'scheduled' and never auto-published. The sibling crons that
# DO fire reliably (inbound-poll, sequences-daily) use multi-minute intervals,
# which was the only thing that differed. "*/2" keeps worst-case publish lag at
# ~2 min while staying clear of the every-minute edge case.
[functions."social-publish-due"]
  schedule = "*/2 * * * *"

# CRON-INBOUND-V1
# Poll the inbound IMAP mailbox for replies every 15 minutes.
# A GitHub Actions backup now mirrors this at the same cadence
# (.github/workflows/inbound-poll.yml) — this was the only one of the three
# scheduled jobs without one, on a site where Netlify's scheduler has silently
# failed to register before. Double-firing is safe: the IMAP search excludes
# messages already carrying the crm-processed label, and storeReply is keyed
# on (email, uid).
[functions."inbound-poll"]
  schedule = "*/15 * * * *"

# FILL-BATCH-V1
# Every 2 minutes, collect any finished calendar-fill Message Batch and turn
# it into drafts. A no-op (one small blob read) when nothing is in flight,
# which is most of the time. 2 minutes matches the sibling schedule that is
# known to register on this site; the job itself is not latency-sensitive.
[functions."social-fill-poll"]
  schedule = "*/2 * * * *"

# CRON-SEQUENCES-V1
# Daily outreach follow-up sequences at 08:00 UTC.
[functions."sequences-daily"]
  schedule = "0 8 * * *"

# CRON-AUTOGEN-V1 (TODO)
# The previous [[scheduled.functions]] entry pointing at /api/social/auto-generate
# was invalid TOML syntax and Netlify silently ignored it, so auto-generate has
# never run on a schedule — only via the "Run now" button. To wire it up the
# same way as social-publish-due, add a thin wrapper at
# netlify/functions/social-auto-generate.mts that POSTs to
# /api/social/auto-generate with the x-internal-call secret, then add a
# matching [functions."social-auto-generate"] entry here. Out of scope for
# this patch — fix focuses on scheduled publishing only.
